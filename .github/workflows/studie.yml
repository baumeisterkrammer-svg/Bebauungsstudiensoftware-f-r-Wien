name: Bebauungsstudie

on:
  workflow_dispatch:
    inputs:
      adresse:
        description: "Adresse in Wien, z. B. Olbrichgasse 9, 1120 Wien"
        required: true
        default: "Olbrichgasse 9, 1120 Wien"
  push:
    branches: ["claude/**"]

jobs:
  studie:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ADRESSE: ${{ github.event.inputs.adresse || 'Olbrichgasse 9, 1120 Wien' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installieren
        run: pip install -e ".[dev]"
      - name: Tests
        run: pytest -q
      - name: Erkundung der Stadt-Wien-Daten
        run: python scripts/erkunden.py "$ADRESSE" ergebnis/erkundung
      - name: Ergebnis hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bebauungsstudie
          path: ergebnis/
