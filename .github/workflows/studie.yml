name: Bebauungsstudie

on:
  workflow_dispatch:
    inputs:
      adresse:
        description: "Adresse in Wien, z. B. Olbrichgasse 9, 1120 Wien"
        required: true
        default: "Olbrichgasse 9, 1120 Wien"
  push:
    branches: ["claude/**"]

jobs:
  studie:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ADRESSE: ${{ github.event.inputs.adresse || 'Olbrichgasse 9, 1120 Wien' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installieren
        run: pip install -e ".[dev]"
      - name: Tests
        run: pytest -q
      - name: Verbindung zu data.wien.gv.at prüfen
        continue-on-error: true
        run: |
          curl -sS -m 20 -o /dev/null -w "data.wien.gv.at WFS: %{http_code} %{time_total}s\n" "https://data.wien.gv.at/daten/geo?service=WFS&request=GetCapabilities&version=1.1.0" || true
          curl -sS -m 20 -A "Mozilla/5.0" -o /dev/null -w "mit Browser-Kennung: %{http_code}\n" "https://data.wien.gv.at/daten/geo?service=WFS&request=GetCapabilities&version=1.1.0" || true
          curl -sS -m 20 -o /dev/null -w "www.wien.gv.at: %{http_code}\n" "https://www.wien.gv.at/" || true
      - name: Erkundung der Stadt-Wien-Daten
        timeout-minutes: 8
        run: python scripts/erkunden.py "$ADRESSE" ergebnis/erkundung
      - name: Ergebnis hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bebauungsstudie
          path: ergebnis/
