name: Bebauungsstudie

# Starten: GitHub → Actions → "Bebauungsstudie" → "Run workflow", Adresse eintragen.
# Ergebnis: im Lauf unter "Artifacts" als ZIP (Bericht, Pläne als PDF/PNG, IFC, DXF)
# und im Branch "ergebnisse".

on:
  workflow_dispatch:
    inputs:
      adresse:
        description: "Adresse in Wien"
        required: true
        default: "Olbrichgasse 9, 1120 Wien"
      grundstuecke:
        description: "Weitere Grundstücksnummern des Bauplatzes (z. B. 453/16), sonst leer"
        default: ""
      rechteck:
        description: "Kataster nicht verwenden, Rechteck Breite × Tiefe rechnen"
        type: boolean
        default: false
      breite:
        description: "Grundstücksbreite an der Straße in m (nur ohne Kataster)"
        default: "20"
      tiefe:
        description: "Grundstückstiefe in m (nur ohne Kataster)"
        default: "40"
      bauweise:
        description: "Bauweise (o, gk, ogk, gr, g); leer = aus dem Plan lesen"
        default: ""
      strassenbreite:
        description: "Abstand der Fluchtlinien in m (leer = unbekannt)"
        default: ""
      hoehe:
        description: "Festgesetzte Gebäudehöhe laut Plan in m (leer = aus der Planschrift)"
        default: ""
      bebaubar_max:
        description: "Höchstzulässige bebaute Fläche laut Plan in m² (leer = keine)"
        default: ""
      modus:
        description: "Studienmodus: beide, neubau oder nachverdichtung"
        type: choice
        options: [beide, neubau, nachverdichtung]
        default: beide
      erkunden:
        description: "Zusätzlich alle Stadt-Wien-Layer erkunden"
        type: boolean
        default: false
  push:
    branches: ["claude/**"]

permissions:
  contents: write

concurrency:
  group: studie-${{ github.ref }}
  cancel-in-progress: true

jobs:
  studie:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ADRESSE: ${{ github.event.inputs.adresse || 'Olbrichgasse 9, 1120 Wien' }}
      BREITE: ${{ github.event.inputs.breite || '20' }}
      TIEFE: ${{ github.event.inputs.tiefe || '40' }}
      BAUWEISE: ${{ github.event.inputs.bauweise }}
      STRASSENBREITE: ${{ github.event.inputs.strassenbreite }}
      HOEHE: ${{ github.event.inputs.hoehe }}
      BEBAUBAR_MAX: ${{ github.event.inputs.bebaubar_max }}
      GRUNDSTUECKE: ${{ github.event.inputs.grundstuecke }}
      RECHTECK: ${{ github.event.inputs.rechteck }}
      MODUS: ${{ github.event.inputs.modus || 'beide' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installieren
        run: |
          sudo apt-get install -y -qq tesseract-ocr > /dev/null
          pip install -e ".[dev]"
      - name: Tests
        run: pytest -q
      - name: Studie rechnen
        timeout-minutes: 8
        run: |
          ARGS="--breite $BREITE --tiefe $TIEFE --modus $MODUS"
          if [ -n "$BAUWEISE" ]; then ARGS="$ARGS --bauweise $BAUWEISE"; fi
          if [ -n "$STRASSENBREITE" ]; then ARGS="$ARGS --strassenbreite $STRASSENBREITE"; fi
          if [ -n "$HOEHE" ]; then ARGS="$ARGS --hoehe $HOEHE"; fi
          if [ -n "$BEBAUBAR_MAX" ]; then ARGS="$ARGS --bebaubar-max $BEBAUBAR_MAX"; fi
          if [ -n "$GRUNDSTUECKE" ]; then ARGS="$ARGS --grundstuecke $GRUNDSTUECKE"; fi
          if [ "$RECHTECK" = "true" ]; then ARGS="$ARGS --rechteck"; fi
          python scripts/studie_adresse.py "$ADRESSE" ergebnis/studie $ARGS
          cat ergebnis/studie/ergebnis.md >> "$GITHUB_STEP_SUMMARY"
      - name: Erkundung aller Layer
        if: ${{ github.event.inputs.erkunden == 'true' }}
        timeout-minutes: 8
        run: python scripts/erkunden.py "$ADRESSE" ergebnis/erkundung
      - name: Ergebnis als Download
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bebauungsstudie
          path: ergebnis/
      - name: Ergebnis im Branch "ergebnisse" ablegen
        if: success()
        run: |
          ZIEL=$(echo "$ADRESSE" | iconv -t ascii//TRANSLIT | tr -cs 'A-Za-z0-9' '-' | sed 's/-$//')
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git fetch origin ergebnisse || true
          git worktree add -B ergebnisse /tmp/erg origin/ergebnisse 2>/dev/null || git worktree add --orphan -b ergebnisse /tmp/erg
          rm -rf "/tmp/erg/$ZIEL" && mkdir -p "/tmp/erg/$ZIEL" && cp -r ergebnis/studie/. "/tmp/erg/$ZIEL/"
          cd /tmp/erg && git add -A && git commit -m "Studie $ADRESSE" && git push origin ergebnisse || echo "keine Änderung"
