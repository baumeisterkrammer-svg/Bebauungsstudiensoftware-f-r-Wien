[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bebauungsstudie"
version = "0.1.0"
description = "Automatisierte Bebauungsstudien auf Grundlage des Wiener Flächenwidmungs- und Bebauungsplans"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["shapely>=2.0", "ifcopenshell>=0.8", "ezdxf>=1.1", "matplotlib>=3.8", "numpy"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
